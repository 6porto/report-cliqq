services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rollout}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-rollout}
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - pgdados:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-rollout} -d ${POSTGRES_DB:-rollout}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: rollout-cliqq-backend
    restart: unless-stopped
    # Lista, não mapa: `- DATABASE_URL` só chega ao container se estiver definida
    # no .env. Injetar a chave vazia faria o Prisma ignorar o .env que o
    # entrypoint grava, e todo `docker compose exec` falharia.
    environment:
      - NODE_ENV=production
      - PORT=3333
      # Definida apenas para apontar num Postgres externo; sem ela, o entrypoint
      # monta a URL a partir das POSTGRES_* escapando a senha.
      - DATABASE_URL
      - POSTGRES_HOST=db
      - POSTGRES_USER=${POSTGRES_USER:-rollout}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      - POSTGRES_DB=${POSTGRES_DB:-rollout}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - SEED_ON_START=${SEED_ON_START:-true}
      - GITLAB_URL=${GITLAB_URL:-}
      - GITLAB_TOKEN=${GITLAB_TOKEN:-}
      - TZ=${TZ:-America/Sao_Paulo}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3333/api/relatorio/resumo']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: rollout-cliqq-web
    restart: unless-stopped
    ports:
      - '${PORTA_WEB:-8080}:80'
    depends_on:
      backend:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    profiles: ['tls']
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMINIO: ${DOMINIO}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  pgdados:
  caddy_data:
  caddy_config:
